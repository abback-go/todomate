name: Supabase keep-alive

# 무료 Supabase 프로젝트는 7일간 API 요청이 없으면 자동 정지된다.
# 3일마다 가벼운 SELECT를 보내 "활동 중" 상태를 유지해 정지를 예방한다.
# 주의: 이미 정지된 프로젝트를 깨우지는 못한다(수동 복원 필요). 정지 '예방'용이다.

on:
  schedule:
    - cron: "17 6 */3 * *"   # 3일마다 06:17 UTC
  workflow_dispatch:          # 수동 실행도 허용

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          code=$(curl -sS -m 30 -o /tmp/resp.txt -w "%{http_code}" \
            "${SUPABASE_URL}/rest/v1/cards?select=id&limit=1" \
            -H "apikey: ${SUPABASE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_KEY}") || true
          echo "HTTP $code"
          head -c 300 /tmp/resp.txt 2>/dev/null || true
          echo
          if [ "$code" = "200" ]; then
            echo "✅ Supabase keep-alive OK"
          else
            echo "::error::Supabase keep-alive failed (HTTP $code). 프로젝트가 정지됐을 수 있습니다 — 대시보드에서 Restore 하세요."
            exit 1
          fi
